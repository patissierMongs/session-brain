[package]
name = "session-brain"
version = "0.7.0"
edition = "2021"
description = "Local-first episodic memory for Claude Code: SQLite/FTS5 index, hybrid semantic search, MCP server, Obsidian export, branch-aware canvas viewer"
license = "MIT"
repository = "https://github.com/patissierMongs/session-brain"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["json"] }
rmcp = { version = "1", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }

[profile.release]
lto = true
