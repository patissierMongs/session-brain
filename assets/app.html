<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>session-brain</title>
<style>
  /* ================= design tokens (dataviz reference palette, dark mode) ================= */
  :root {
    color-scheme: dark;
    --page:        #0d0d0d;
    --surface-1:   #1a1a19;
    --surface-2:   #141413;
    --surface-3:   #1f1f1e;
    --text-1:      #ffffff;
    --text-2:      #c3c2b7;
    --text-3:      #898781;
    --grid:        #2c2c2a;
    --baseline:    #383835;
    --border:      rgba(255,255,255,0.10);
    --border-soft: rgba(255,255,255,0.06);
    --main:        #3987e5;
    --sans: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --map-w: 64px;
    --header-h: 50px;
    --read-w: 760px;
    --rail-w: 330px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--page); color: var(--text-1); font: 13px/1.55 var(--sans); overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
  a { color: inherit; text-decoration: none; }
  input, select { font: inherit; color: var(--text-1); background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px; padding: 6px 10px; outline: none; }
  input:focus, select:focus { border-color: rgba(57,135,229,0.55); }
  code { font-family: var(--mono); font-size: 0.92em; background: var(--surface-2); border: 1px solid var(--border-soft); border-radius: 4px; padding: 0 4px; color: var(--text-2); }
  mark { background: rgba(201,133,0,0.30); color: #f2d597; border-radius: 3px; padding: 0 2px; }

  /* ================= top header ================= */
  .hdr {
    height: var(--header-h); display: flex; align-items: center; gap: 14px;
    padding: 0 16px; background: var(--surface-1); border-bottom: 1px solid var(--border);
    position: relative; z-index: 20;
  }
  .hdr .brand { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 13.5px; }
  .hdr .brand .logo { width: 20px; height: 20px; border-radius: 6px; background: linear-gradient(135deg,#3987e5,#1c5cab); display: grid; place-items: center; color: #fff; }
  .hdr nav { display: flex; gap: 4px; margin-left: 6px; }
  .hdr nav a {
    font-size: 12.5px; color: var(--text-3); padding: 5px 12px; border-radius: 7px;
    transition: background .13s, color .13s;
  }
  .hdr nav a:hover { color: var(--text-1); background: rgba(255,255,255,0.05); }
  .hdr nav a.active { color: var(--text-1); background: rgba(57,135,229,0.14); }
  .hdr .spacer { flex: 1; }
  .hdr .demo-flag {
    font-size: 10.5px; font-weight: 700; letter-spacing: .05em; color: #f2c57a;
    border: 1px solid rgba(201,133,0,0.5); background: rgba(201,133,0,0.12);
    border-radius: 5px; padding: 2px 8px;
  }

  #view { height: calc(100% - var(--header-h)); }

  /* ================= generic page (list / search) ================= */
  .page { height: 100%; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--baseline) transparent; }
  .page-inner { max-width: 880px; margin: 0 auto; padding: 28px 24px 80px; }
  .page h1 { font-size: 16px; margin: 0 0 4px; }
  .page .sub { font-size: 12px; color: var(--text-3); margin-bottom: 18px; }

  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar input[type=text], .toolbar input[type=search] { flex: 1; min-width: 200px; }

  /* session list */
  .sess-list { border: 1px solid var(--border-soft); border-radius: 10px; overflow: hidden; }
  .sess-row {
    display: grid; grid-template-columns: 118px 120px 1fr auto; gap: 12px; align-items: center;
    padding: 10px 14px; border-top: 1px solid var(--border-soft);
    background: var(--surface-1); transition: background .12s; cursor: pointer;
  }
  .sess-row:first-child { border-top: none; }
  .sess-row:hover { background: #212120; }
  .sess-row .d { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
  .sess-row .p { font-size: 11.5px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess-row .p .pchip { background: var(--surface-2); border: 1px solid var(--border-soft); border-radius: 5px; padding: 1px 7px; font-family: var(--mono); font-size: 10.5px; }
  .sess-row .t { font-size: 12.8px; color: var(--text-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess-row .m { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); white-space: nowrap; display: flex; gap: 10px; }
  .sess-row .m b { color: var(--text-2); font-weight: 600; }
  .list-empty { padding: 26px; text-align: center; color: var(--text-3); font-size: 12.5px; background: var(--surface-1); }

  /* search */
  .sem-toggle { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-2); cursor: pointer; user-select: none; padding: 6px 10px; border: 1px solid var(--border); border-radius: 7px; }
  .sem-toggle input { accent-color: var(--main); margin: 0; }
  .search-note { font-size: 11.5px; color: var(--text-3); margin: 8px 2px 12px; display: flex; gap: 14px; flex-wrap: wrap; }
  .search-note .warn { color: #f2c57a; }
  .hit {
    display: block; width: 100%; text-align: left;
    background: var(--surface-1); border: 1px solid var(--border-soft); border-radius: 10px;
    padding: 11px 14px; margin-bottom: 10px; transition: border-color .12s, background .12s; cursor: pointer;
  }
  .hit:hover { border-color: var(--border); background: #212120; }
  .hit .hd { display: flex; align-items: baseline; gap: 9px; margin-bottom: 4px; flex-wrap: wrap; }
  .hit .title { font-size: 12.8px; font-weight: 600; color: var(--text-1); }
  .hit .proj { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); }
  .hit .ts { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--text-3); }
  .hit .kind { font-size: 9.5px; font-weight: 700; letter-spacing: .04em; border-radius: 4px; padding: 1px 6px; }
  .hit .kind.main { color: #9cc4f2; background: rgba(57,135,229,0.14); border: 1px solid rgba(57,135,229,0.35); }
  .hit .kind.subagent { color: #8fd9bd; background: rgba(25,158,112,0.14); border: 1px solid rgba(25,158,112,0.4); }
  .hit .snippet { font-size: 12.3px; color: var(--text-2); line-height: 1.5; }
  .hit .role-tag { font-size: 10.5px; font-weight: 650; color: var(--text-3); margin-right: 6px; }

  /* loading / error */
  .center-box { height: 100%; display: grid; place-items: center; }
  .load { color: var(--text-3); font-size: 12.5px; display: flex; align-items: center; gap: 10px; }
  .spin { width: 14px; height: 14px; border: 2px solid var(--baseline); border-top-color: var(--main); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .err-box { max-width: 460px; text-align: center; padding: 30px; }
  .err-box .ico { font-size: 26px; margin-bottom: 10px; }
  .err-box h2 { font-size: 14px; margin: 0 0 8px; }
  .err-box p { font-size: 12.3px; color: var(--text-2); margin: 0 0 18px; line-height: 1.6; }
  .err-box .detail { font-family: var(--mono); font-size: 11px; color: var(--text-3); background: var(--surface-2); border: 1px solid var(--border-soft); border-radius: 7px; padding: 8px 11px; margin-bottom: 18px; word-break: break-all; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12.3px; font-weight: 600;
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 14px;
    color: var(--text-1); transition: background .13s;
  }
  .btn:hover { background: rgba(255,255,255,0.06); }
  .btn.primary { background: var(--main); border-color: transparent; color: #0d0d0d; }
  .btn.primary:hover { filter: brightness(1.12); background: var(--main); }
  .btn.amber { border-color: rgba(201,133,0,0.5); color: #f2c57a; }
  .btn.amber:hover { background: rgba(201,133,0,0.10); }

  /* ================= session view (v2 — reading-first) ================= */
  .session-view { height: 100%; display: flex; flex-direction: column; }
  .subhdr {
    display: flex; align-items: center; gap: 11px; flex-wrap: nowrap;
    padding: 8px 16px; background: var(--surface-1); border-bottom: 1px solid var(--border-soft);
    min-height: 46px;
  }
  .subhdr .back { color: var(--text-3); font-size: 12.5px; padding: 4px 8px; border-radius: 6px; }
  .subhdr .back:hover { color: var(--text-1); background: rgba(255,255,255,0.05); }
  .subhdr .stitle { font-weight: 650; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 60px; }
  .subhdr .chip { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); background: var(--surface-2); border: 1px solid var(--border-soft); border-radius: 5px; padding: 2px 8px; white-space: nowrap; }
  .subhdr .dates { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); white-space: nowrap; }
  .subhdr .spacer { flex: 1; }
  .resume-cmd {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--mono); font-size: 10.8px; color: var(--text-2);
    background: var(--surface-2); border: 1px solid var(--border-soft);
    border-radius: 7px; padding: 4px 6px 4px 10px; white-space: nowrap; max-width: 300px;
  }
  .resume-cmd .cmdtext { overflow: hidden; text-overflow: ellipsis; }
  .resume-cmd button { color: var(--text-3); border: 1px solid var(--border-soft); border-radius: 5px; padding: 2px 7px; font-size: 10px; transition: color .13s, background .13s; }
  .resume-cmd button:hover { color: var(--text-1); background: rgba(255,255,255,0.07); }
  .stat-badge {
    display: flex; align-items: center; gap: 7px; font-size: 11.8px; color: var(--text-2);
    background: rgba(57,135,229,0.10); border: 1px solid rgba(57,135,229,0.30);
    border-radius: 999px; padding: 3px 11px; white-space: nowrap;
  }
  .stat-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--main); }
  .stat-badge b { color: var(--text-1); font-weight: 600; }

  .app { display: flex; flex: 1; min-height: 0; }
  .scroller { flex: 1; overflow-y: auto; position: relative; scrollbar-width: none; background: var(--page); }
  .scroller::-webkit-scrollbar { display: none; }
  .thread-wrap { max-width: var(--read-w); margin: 0 auto; position: relative; }
  .session-view.has-forks .thread-wrap { max-width: calc(var(--read-w) + var(--rail-w) + 26px); }
  .thread { max-width: var(--read-w); margin: 0 auto; padding: 30px 24px 26vh; }
  .session-view.has-forks .thread { margin: 0; }
  .branch-rail { position: absolute; top: 0; bottom: 0; left: calc(var(--read-w) + 26px); width: var(--rail-w); }
  .thread-intro { text-align: center; font-size: 11.5px; color: var(--text-3); padding-bottom: 26px; }
  .thread-intro b { color: var(--text-2); font-weight: 600; }

  /* ---- chat rows (Claude Desktop style) ---- */
  .msg-row { display: flex; margin: 0 0 22px; }
  .msg-row.user { justify-content: flex-end; }
  .bubble { min-width: 0; position: relative; }
  .msg-row.user .bubble {
    max-width: 82%;
    background: rgba(57,135,229,0.13); border: 1px solid rgba(57,135,229,0.22);
    border-radius: 16px 4px 16px 16px; padding: 10px 16px 9px;
  }
  .msg-row.asst .bubble {
    max-width: 85%;
    background: var(--surface-1); border: 1px solid var(--border-soft);
    border-radius: 4px 16px 16px 16px; padding: 10px 16px 9px;
  }
  .bubble .body {
    font-size: 14px; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
    min-width: 0;
  }
  .msg-row.asst .body { color: #d9d8cf; }
  .msg-row.user .body { color: #e9e8e1; }
  .msg-meta {
    font-family: var(--mono); font-size: 10px; color: var(--text-3);
    margin-top: 6px; opacity: 0; transition: opacity .15s; user-select: none;
  }
  .msg-row:hover .msg-meta { opacity: .85; }
  .msg-row.user .msg-meta { text-align: right; }

  /* markdown-ish code rendering inside assistant bodies */
  .cb {
    display: block; background: var(--surface-2); border: 1px solid var(--border-soft);
    border-radius: 9px; padding: 10px 13px; margin: 4px 0;
    font-family: var(--mono); font-size: 12px; line-height: 1.55; color: var(--text-2);
    overflow-x: auto; white-space: pre;
  }
  .cb .cb-lang { display: block; font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); margin-bottom: 6px; user-select: none; }
  .body code.ic { font-family: var(--mono); font-size: 0.9em; background: rgba(255,255,255,0.07); border: 1px solid var(--border-soft); border-radius: 4px; padding: 0 4px; color: #dcdbd2; }
  .body b { color: inherit; font-weight: 650; }

  /* ---- thinking / tool-step accordions (shared visual language) ---- */
  .think { margin: 0 0 10px; max-width: 100%; }
  .think-toggle, .steps-toggle {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; color: var(--text-3); padding: 2px 4px; border-radius: 6px;
    transition: color .13s, background .13s; user-select: none;
  }
  .think-toggle:hover, .steps-toggle:hover { color: var(--text-2); background: rgba(255,255,255,0.04); }
  .think-toggle .chev, .steps-toggle .chev { font-size: 9px; transition: transform .16s; display: inline-block; }
  .think-toggle[aria-expanded="true"] .chev, .steps-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .think-body {
    display: none; margin: 7px 0 2px 6px; padding: 2px 0 2px 13px;
    border-left: 2px solid var(--grid);
    font-size: 12.3px; line-height: 1.6; font-style: italic; color: var(--text-3);
    white-space: pre-wrap; word-break: break-word;
  }
  .think.open .think-body { display: block; }
  .think-body .think-sep { display: block; height: 10px; }

  /* ---- tool-step accordion ---- */
  .steps { margin: -4px 0 18px; }
  .steps-body {
    display: none; margin: 7px 0 2px 6px; padding: 2px 0 2px 13px;
    border-left: 2px solid var(--grid);
  }
  .steps.open .steps-body { display: block; }
  .steps-body .step {
    display: flex; gap: 8px; align-items: flex-start;
    font-family: var(--mono); font-size: 11.3px; line-height: 1.55; color: var(--text-3);
    background: var(--surface-2); border: 1px solid var(--border-soft); border-radius: 7px;
    padding: 5px 9px; margin: 0 0 6px;
  }
  .steps-body .step .g { flex-shrink: 0; color: var(--baseline); user-select: none; }
  .steps-body .step .step-txt { white-space: pre-wrap; word-break: break-word; min-width: 0; }
  .steps-body .step.empty .step-txt { font-style: italic; }

  /* ---- fork anchor dot (wide layout: association marker only) ---- */
  .fork-dot {
    position: absolute; top: -5px; width: 10px; height: 10px; border-radius: 50%;
    border: 2px solid var(--page); z-index: 3; pointer-events: none;
  }
  .msg-row.asst .fork-dot { left: -5px; }
  .msg-row.user .fork-dot { right: -5px; }

  /* ---- right-margin branch cards (always visible when forks exist) ---- */
  .rc-card {
    position: absolute; left: 0; width: 100%;
    background: var(--surface-3); border: 1px solid var(--border); border-left-width: 3px;
    border-radius: 10px; padding: 10px 12px 11px;
  }
  .rc-card .rc-conn { position: absolute; left: -21px; top: 15px; width: 21px; height: 2px; opacity: .75; }
  .rc-card .rc-conn::before {
    content: ""; position: absolute; left: -5px; top: -2.5px;
    width: 7px; height: 7px; border-radius: 50%; background: inherit;
  }
  .rc-card .rc-head { display: flex; align-items: baseline; gap: 7px; margin-bottom: 6px; }
  .rc-card .rc-name { font-weight: 650; font-size: 11.5px; }
  .rc-card .rc-time { margin-left: auto; font-family: var(--mono); font-size: 9.8px; color: var(--text-3); white-space: nowrap; }
  .rc-card .rc-quote {
    border-left: 2px solid var(--baseline); padding: 1px 0 1px 8px; margin: 0 0 8px;
    color: var(--text-2); font-size: 11.5px; line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .rc-card .rc-quote .q-role { font-size: 10px; font-weight: 650; color: var(--text-3); margin-right: 5px; }
  .rc-card .rc-stats {
    display: flex; gap: 10px; font-family: var(--mono); font-size: 9.8px; color: var(--text-3);
    margin-bottom: 9px; white-space: nowrap; overflow: hidden;
  }
  .rc-card .rc-stats b { color: var(--text-2); font-weight: 600; }
  .rc-card .switch-btn { font-size: 11px; padding: 4px 11px; }
  .rc-card.flash { animation: flash 1.4s ease-out 1; }

  /* ---- per-message fork affordance (narrow-viewport fallback: hover chip + inline expansion) ---- */
  .fork-chip {
    position: absolute; top: -11px; z-index: 3;
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10.5px; line-height: 1.5; color: var(--text-2);
    border: 1px solid; border-radius: 999px; padding: 2px 9px;
    background: var(--surface-3);
    opacity: .25; transition: opacity .15s, box-shadow .15s;
    white-space: nowrap; user-select: none;
  }
  .msg-row.asst .fork-chip { left: -6px; }
  .msg-row.user .fork-chip { right: -6px; }
  .msg-row:hover .fork-chip, .fork-chip:hover, .fork-chip:focus-visible,
  .fork-chip[aria-expanded="true"], .fork-chip.flash { opacity: 1; }
  .fork-chip b { font-weight: 650; }
  .fork-chip .fc-label { display: none; }
  .msg-row:hover .fc-label, .fork-chip:hover .fc-label, .fork-chip[aria-expanded="true"] .fc-label { display: inline; }
  .fork-chip.flash { animation: flash 1.4s ease-out 1; }
  @keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(57,135,229,0.55); } 60% { box-shadow: 0 0 0 9px rgba(57,135,229,0); } 100% { box-shadow: none; } }

  .fork-inline { display: none; margin: -12px 0 24px; max-width: 640px; animation: pv-in .16s ease-out; }
  .fork-inline.open { display: block; }
  .fork-inline.from-user { margin-left: auto; }
  @keyframes pv-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .pv-alt {
    background: var(--surface-3); border: 1px solid var(--border); border-left-width: 3px;
    border-radius: 10px; padding: 12px 14px 12px 15px; margin-bottom: 8px;
  }
  .pv-alt .pv-head { display: flex; align-items: baseline; gap: 9px; margin-bottom: 8px; }
  .pv-alt .pv-name { font-weight: 650; font-size: 12.5px; }
  .pv-alt .pv-time { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--text-3); }
  .pv-alt .pv-quote {
    border-left: 2px solid var(--baseline); padding: 2px 0 2px 10px; margin: 0 0 10px;
    color: var(--text-2); font-size: 12.3px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .pv-alt .q-role { font-size: 10.5px; font-weight: 650; color: var(--text-3); margin-right: 6px; }
  .pv-alt .pv-stats { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 11px; }
  .pv-alt .pv-stat { font-size: 10.8px; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--border-soft); border-radius: 5px; padding: 2px 8px; }
  .pv-alt .pv-stat b { color: var(--text-1); font-weight: 600; }
  .switch-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 650; color: #0d0d0d; border-radius: 7px; padding: 6px 13px; transition: filter .15s, transform .1s; }
  .switch-btn:hover { filter: brightness(1.13); }
  .switch-btn:active { transform: translateY(1px); }
  .pv-hint { font-size: 10.8px; color: var(--text-3); margin-left: 10px; }

  /* ---- minimap (simplified) ---- */
  .minimap { width: var(--map-w); flex-shrink: 0; background: var(--surface-2); border-left: 1px solid var(--border); position: relative; cursor: pointer; user-select: none; }
  .mm-layer { position: absolute; inset: 6px; }
  .mm-bar { position: absolute; border-radius: 1px; pointer-events: none; }
  .mm-bar.u { background: rgba(57,135,229,0.85); right: 8px; width: 16px; }
  .mm-bar.a { background: #41413b; left: 8px; width: 24px; }
  .mm-bar.t { background: #262624; left: 20px; width: 12px; }
  .mm-fork { position: absolute; left: 5px; right: 5px; height: 2px; border-radius: 2px; pointer-events: none; opacity: .9; }
  .mm-viewport { position: absolute; left: 2px; right: 2px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.22); border-radius: 4px; pointer-events: none; transition: background .15s; }
  .minimap:hover .mm-viewport { background: rgba(255,255,255,0.11); }

  /* toast */
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%,16px);
    background: #232322; border: 1px solid var(--border); border-radius: 9px; padding: 9px 16px;
    font-size: 12px; color: var(--text-1); box-shadow: 0 8px 28px rgba(0,0,0,0.5);
    opacity: 0; pointer-events: none; transition: opacity .22s, transform .22s; z-index: 50;
    display: flex; align-items: center; gap: 8px; max-width: 80vw;
  }
  .toast.show { opacity: 1; transform: translate(-50%,0); }
  .toast .tdot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  /* ---- responsive: wide = margin rail, narrow = corner chip fallback ---- */
  @media (min-width: 1200px) {
    .session-view.has-forks .fork-chip, .session-view.has-forks .fork-inline { display: none !important; }
  }
  @media (max-width: 1199.98px) {
    .session-view.has-forks .thread-wrap { max-width: var(--read-w); }
    .session-view.has-forks .thread { margin: 0 auto; }
    .branch-rail, .fork-dot { display: none !important; }
  }

  .fading { animation: thread-in .25s ease-out; }
  @keyframes thread-in { from { opacity: .25; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>

<script>
"use strict";
/* ============================================================================
   session-brain SPA v2 — 세션 목록 / reading-first 대화 뷰어 / 검색
   같은 origin의 /api/* 를 사용한다. 서버가 없으면 데모 데이터를 제안한다.
   ============================================================================ */

/* ---------------- utilities ---------------- */

const $view = document.getElementById("view");
const FORK_COLORS = ["#d95926", "#199e70", "#c98500", "#d55181", "#9085e9", "#008300"];
const OVERFLOW_COLOR = "#898781";

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function pad(n) { return String(n).padStart(2, "0"); }
function fmtDT(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtDurMs(ms) {
  if (ms == null || isNaN(ms) || ms < 0) return "—";
  const min = Math.round(ms / 60000);
  if (min < 1) return "1분 미만";
  if (min < 60) return `${min}분`;
  const h = Math.floor(min / 60);
  return `${h}시간 ${min % 60}분`;
}
let toastTimer;
function showToast(html) {
  const t = document.getElementById("toast");
  t.innerHTML = html;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 4200);
}
function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.cssText = "position:fixed;opacity:0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  ta.remove();
}

/* markdown-mini: XSS-safe. 전부 escape한 뒤 ```fence``` / `inline` / **bold** 만 살린다. */
function renderInline(escaped) {
  return escaped
    .replace(/`([^`\n]+)`/g, '<code class="ic">$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
}
function renderRich(raw) {
  const parts = String(raw == null ? "" : raw).split("```");
  if (parts.length === 1) return renderInline(esc(parts[0]));
  let out = "";
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 1) {
      let code = parts[i], lang = "";
      const nl = code.indexOf("\n");
      const head = nl >= 0 ? code.slice(0, nl).trim() : "";
      if (nl >= 0 && /^[\w#+.-]{0,20}$/.test(head)) { lang = head; code = code.slice(nl + 1); }
      code = code.replace(/\n$/, "");
      out += `<span class="cb">${lang ? `<span class="cb-lang">${esc(lang)}</span>` : ""}${esc(code)}</span>`;
    } else {
      let text = parts[i];
      if (i > 0) text = text.replace(/^\n/, "");          // fence 직후 개행 제거
      if (i < parts.length - 1) text = text.replace(/\n$/, ""); // fence 직전 개행 제거
      out += renderInline(esc(text));
    }
  }
  return out;
}

/* ---------------- API layer (+ demo fallback) ---------------- */

const appState = { demo: false, sessionsCache: null, searchState: { q: "", semantic: true, project: "" } };

async function fetchJSON(url) {
  let res;
  try {
    res = await fetch(url);
  } catch (e) {
    const err = new Error("서버에 연결할 수 없습니다. session-brain 서버(localhost:7777)가 실행 중인지 확인하세요.");
    err.detail = String(e); err.network = true;
    throw err;
  }
  if (!res.ok) {
    let body = "";
    try { body = await res.text(); } catch (e) {}
    const err = new Error(`서버가 오류를 반환했습니다 (HTTP ${res.status}).`);
    err.detail = `${url} → ${res.status} ${res.statusText}${body ? " · " + body.slice(0, 200) : ""}`;
    throw err;
  }
  return res.json();
}

const api = {
  async sessions() {
    if (appState.demo) return { sessions: DEMO.sessions };
    return fetchJSON("/api/sessions");
  },
  async session(id) {
    if (appState.demo) {
      const d = DEMO.details[id];
      if (!d) throw new Error("데모 데이터에 없는 세션입니다.");
      return d;
    }
    return fetchJSON("/api/session/" + encodeURIComponent(id));
  },
  async search(q, semantic, project) {
    if (appState.demo) return DEMO.search(q, project);
    const p = new URLSearchParams({ q, semantic: semantic ? "1" : "0", limit: "20" });
    if (project) p.set("project", project);
    return fetchJSON("/api/search?" + p.toString());

};

function enableDemo() {
  appState.demo = true;
  appState.sessionsCache = null;

/* ---------------- rendering helpers ---------------- */

function renderLoading(msg) {
  $view.innerHTML = `<div class="center-box"><div class="load"><span class="spin"></span>${esc(msg || "불러오는 중…")}</div></div>`;
}
function renderError(err, opts) {
  opts = opts || {};
  const demoBtn = opts.offerDemo ? `<button class="btn amber" id="errDemo">데모 데이터로 보기</button>` : "";
  const backBtn = opts.backHash ? `<a class="btn" href="${opts.backHash}">← 돌아가기</a>` : "";
  $view.innerHTML = `
    <div class="center-box"><div class="err-box">
      <div class="ico">⚠️</div>
      <h2>데이터를 불러오지 못했습니다</h2>
      <p>${esc(err.message || String(err))}</p>
      ${err.detail ? `<div class="detail">${esc(err.detail)}</div>` : ""}
      <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap">
        <button class="btn primary" id="errRetry">다시 시도</button>
        ${backBtn}${demoBtn}
      </div>
    </div></div>`;
  const r = document.getElementById("errRetry");
  if (r) r.addEventListener("click", () => route());
  const d = document.getElementById("errDemo");
  if (d) d.addEventListener("click", () => { enableDemo(); route(); });
}

/* ============================================================================
   Route: #/session/<id> — reading-first conversation viewer
   ============================================================================ */

async function viewSession(id) {

  } catch (err) {

/* ---------------- message tree ---------------- */

function buildTree(links, messages) {
  const nodes = new Map();
  (links || []).forEach(l => {
    const m = (messages || {})[l.uuid];
    nodes.set(l.uuid, {
      uuid: l.uuid, parentUuid: l.parent_uuid || null,
      line: l.line_no ?? 0, role: l.role || (m && m.role) || "assistant",
      hasContent: !!(l.has_content && m),
      kind: m ? (m.kind === "thinking" ? "thinking" : m.kind === "tool" ? "tool" : "text") : "text", // kind 없으면 text
      ts: m ? m.ts : null, content: m ? m.content : null,
      children: [],
    });
  });
  const roots = [];
  nodes.forEach(n => {
    if (n.parentUuid && nodes.has(n.parentUuid)) nodes.get(n.parentUuid).children.push(n);
    else roots.push(n); // parent 없음/유실 → root 취급 (defensive)
  });
  nodes.forEach(n => n.children.sort((a, b) => a.line - b.line));
  roots.sort((a, b) => a.line - b.line);

  let root;
  if (roots.length === 1) root = roots[0];
  else {
    root = { uuid: "__virtual_root", virtual: true, line: -1, role: "assistant", hasContent: false, kind: "text", ts: null, content: null, children: roots };
  }
  // 각 노드의 서브트리 최대 line_no (main branch 판정용) — iterative post-order
  const order = [];
  const stack = [root];
  while (stack.length) { const n = stack.pop(); order.push(n); for (const c of n.children) stack.push(c); }
  for (let i = order.length - 1; i >= 0; i--) {
    const n = order[i];
    n.maxLine = n.line;
    for (const c of n.children) if (c.maxLine > n.maxLine) n.maxLine = c.maxLine;
  }
  return { root, nodes };
}

function isTextMsg(n) { return n.hasContent && n.kind === "text"; }

function subtreeStats(rootNode) {
  let nodeCount = 0, textCount = 0, thinkCount = 0, maxDepth = 0, forksInside = 0;
  let minTs = null, maxTs = null, firstText = null, firstContent = null;
  const stack = [[rootNode, 1]];
  while (stack.length) {
    const [n, d] = stack.pop();
    nodeCount++;
    if (d > maxDepth) maxDepth = d;
    if (n.children.length > 1) forksInside++;
    if (n.hasContent) {
      if (n.kind === "thinking") thinkCount++; else if (n.kind === "text") textCount++;
      if (!firstContent || n.line < firstContent.line) firstContent = n;
      if (isTextMsg(n) && (!firstText || n.line < firstText.line)) firstText = n;
      if (n.ts) {
        const t = Date.parse(n.ts);
        if (!isNaN(t)) {
          if (minTs == null || t < minTs) minTs = t;
          if (maxTs == null || t > maxTs) maxTs = t;
        }
      }
    }
    for (const c of n.children) stack.push([c, d + 1]);
  }
  return { nodeCount, textCount, thinkCount, maxDepth, forksInside,
    firstContent: firstText || firstContent,
    durMs: (minTs != null && maxTs != null) ? maxTs - minTs : null, minTs, maxTs };
}

/* ---------------- SessionViewer ---------------- */

class SessionViewer {
  constructor(container, id, data) {
    this.id = id;
    this.meta = data.meta || {};
    const t = buildTree(data.links, data.messages);
    this.root = t.root; this.nodes = t.nodes;
    this.selections = {};       // forkUuid → chosen child uuid
    this.colorMap = new Map();  // branch subtree root uuid → color
    this.colorNext = 0;

    this.forkList = [];
    this.nodes.forEach(n => { if (n.children.length > 1) this.forkList.push(n); });
    if (this.root.virtual && this.root.children.length > 1) this.forkList.push(this.root);
    this.forkList.sort((a, b) => a.line - b.line);
    this.branchTotal = this.forkList.reduce((s, f) => s + f.children.length - 1, 0);
    this.hasForks = this.branchTotal > 0;

    this.buildLayout(container);
    this.render();
  }

  branchColor(uuid) {
    if (!this.colorMap.has(uuid)) {
      this.colorMap.set(uuid, this.colorNext < FORK_COLORS.length ? FORK_COLORS[this.colorNext++] : OVERFLOW_COLOR);
    }
    return this.colorMap.get(uuid);
  }
  forkName(fork) {
    const i = this.forkList.indexOf(fork);
    return "Fork " + String.fromCharCode(65 + (i < 0 ? 0 : i % 26));
  }
  selectedChild(fork) {
    const id = this.selections[fork.uuid];
    const c = id && fork.children.find(x => x.uuid === id);
    if (c) return c;
    // 기본 main: 서브트리에 가장 높은 line_no를 가진 자식
    return fork.children.reduce((a, b) => (b.maxLine > a.maxLine ? b : a), fork.children[0]);
  }
  computeMainPath() {
    const path = [];
    let cur = this.root;
    while (cur) {
      if (!cur.virtual) path.push(cur);
      if (!cur.children.length) break;
      cur = cur.children.length > 1 ? this.selectedChild(cur) : cur.children[0];
    }
    return path;
  }

  /* ----- static layout ----- */
  buildLayout(container) {
    const m = this.meta;
    const resumeCmd = `claude --resume ${this.id}`;
    container.innerHTML = `
      <div class="session-view${this.hasForks ? " has-forks" : ""}">
        <div class="subhdr">
          <a class="back" href="#/">←</a>
          <span class="stitle" title="${esc(m.title || "")}">${esc(m.title || "(제목 없음)")}</span>
          <span class="chip">${esc(m.project_name || m.project || "?")}</span>
          ${m.git_branch ? `<span class="chip">⎇ ${esc(m.git_branch)}</span>` : ""}
          <span class="dates">${esc(fmtDT(m.first_ts))} → ${esc(fmtDT(m.last_ts))}</span>
          <div class="spacer"></div>
          <span class="resume-cmd" title="${esc(resumeCmd)}">
            <span class="cmdtext">${esc(resumeCmd)}</span>
            <button id="copyResume">복사</button>
          </span>
          <div class="stat-badge" id="svBadge"></div>
        </div>
        <div class="app">
          <div class="scroller" id="svScroller">
            <div class="thread-wrap" id="svWrap">
              <div class="thread" id="svThread"></div>
              ${this.hasForks ? `<div class="branch-rail" id="svRail" aria-label="abandoned branches"></div>` : ""}
            </div>
          </div>
          <div class="minimap" id="svMinimap" title="클릭 또는 드래그로 이동"><div class="mm-layer" id="svMmLayer"></div></div>
        </div>
      </div>`;

    this.scroller = container.querySelector("#svScroller");
    this.wrapEl = container.querySelector("#svWrap");
    this.thread = container.querySelector("#svThread");
    this.railEl = container.querySelector("#svRail");
    this.mmLayer = container.querySelector("#svMmLayer");
    const minimap = container.querySelector("#svMinimap");

    container.querySelector("#copyResume").addEventListener("click", () => {
      copyText(resumeCmd).then(() => showToast(`<code>${esc(resumeCmd)}</code> 를 복사했습니다.`));
    });

    let ticking = false;
    this.scroller.addEventListener("scroll", () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => { this.updateViewport(); ticking = false; });
    });
    this._onResize = () => requestAnimationFrame(() => this.reflow()); // 카드 위치 + 미니맵 재계산
    window.addEventListener("resize", this._onResize);

    const mapScroll = clientY => {
      const rect = this.mmLayer.getBoundingClientRect();
      const scale = this.mmLayer.clientHeight / this.scroller.scrollHeight;
      this.scroller.scrollTop = (clientY - rect.top) / scale - this.scroller.clientHeight / 2;
    };
    minimap.addEventListener("pointerdown", e => {
      minimap.setPointerCapture(e.pointerId);
      mapScroll(e.clientY);
      const move = ev => mapScroll(ev.clientY);
      const up = () => { minimap.removeEventListener("pointermove", move); minimap.removeEventListener("pointerup", up); };
      minimap.addEventListener("pointermove", move);
      minimap.addEventListener("pointerup", up);
    });
  }

  /* ----- main render ----- */
  render() {
    const path = this.computeMainPath();
    this.mainPath = path;
    this.thread.innerHTML = "";
    if (this.railEl) this.railEl.innerHTML = "";
    this.railItems = [];          // [{card, row, forkUuid}] — 오른쪽 여백의 분기 카드
    this.forkAnchors = new Map(); // fork.uuid → anchor msg-row element
    this._openInline = null;      // (narrow fallback) 인라인 분기 확장은 한 번에 하나만

    const intro = document.createElement("div");
    intro.className = "thread-intro";
    intro.innerHTML = `<b>episodic memory</b> · ` + (this.hasForks
      ? `main branch를 처음부터 끝까지 표시합니다 — abandoned branch는 오른쪽 여백 카드에서 바로 확인하고 전환할 수 있습니다.`
      : `이 세션에는 분기가 없습니다 (선형 대화).`);
    this.thread.appendChild(intro);

    let contentIdx = 0;
    let toolNodes = [];       // 연속된 tool step 노드 (kind:"tool" 또는 content 없는 링크)
    let pendingThink = [];    // 다음 Claude 텍스트 버블 위에 붙일 thinking 노드들
    let lastRow = null;       // 마지막으로 렌더된 메시지 버블 row
    let pendingForks = [];    // 아직 앞에 버블이 없어 첫 버블을 기다리는 fork들
    const rowForks = [];      // [{row, fork, isStart}] — 대화 흐름을 끊지 않는 per-message 분기 앵커
    const anchorFork = (fork, isStart) => {
      if (lastRow) rowForks.push({ row: lastRow, fork, isStart: !!isStart });
      else pendingForks.push({ fork, isStart: !!isStart });
    };
    const flushTools = () => {
      if (!toolNodes.length) return;
      this.thread.appendChild(this.buildToolBlock(toolNodes));
      toolNodes = [];
    };
    const flushThink = () => {
      if (!pendingThink.length) return;
      this.thread.appendChild(this.buildThinkBlock(pendingThink));
      pendingThink = [];
    };

    // 세션 시작점 분기(virtual root) → main path의 첫 메시지에 부착
    if (this.root.virtual && this.root.children.length > 1) anchorFork(this.root, true);

    path.forEach(node => {
      const isFork = node.children.length > 1;
      if (!node.hasContent || node.kind === "tool") {
        toolNodes.push(node); // 연속 tool step은 하나의 아코디언으로
        if (isFork) anchorFork(node); // 직전 버블에 부착 (흐름은 끊지 않음)
        return;
      }
      if (node.kind === "thinking") {
        pendingThink.push(node); // 연속 thinking은 하나의 아코디언으로 병합
        if (isFork) anchorFork(node);
        return;
      }
      flushTools();
      contentIdx++;
      flushThink(); // Claude 텍스트 버블 바로 위(사용자 버블이면 standalone)
      const row = this.buildMsgRow(node, contentIdx);
      this.thread.appendChild(row);
      lastRow = row;
      if (pendingForks.length) {
        pendingForks.forEach(p => rowForks.push({ row, fork: p.fork, isStart: p.isStart }));
        pendingForks = [];
      }
      if (isFork) anchorFork(node); // 자기 자신의 버블에 부착
    });
    flushTools();
    flushThink(); // 뒤에 텍스트가 없으면 standalone

    // row별로 fork를 묶어 여백 카드 + 앵커 마커(+ narrow fallback 칩) 부착
    const byRow = new Map();
    rowForks.forEach(({ row, fork, isStart }) => {
      if (!byRow.has(row)) byRow.set(row, []);
      byRow.get(row).push({ fork, isStart });
      this.forkAnchors.set(fork.uuid, row);
    });
    byRow.forEach((forks, row) => this.attachForkAffordance(row, forks));

    requestAnimationFrame(() => this.reflow());
    this.updateBadge(path);
  }

  /* 카드 위치 + 미니맵 재계산 (레이아웃 변화 후 항상 호출) */
  reflow() {
    this.positionRailCards();
    this.renderMinimap();
  }

  /* 오른쪽 여백 카드: 앵커 row의 offsetTop에 정렬, 겹치면 아래로 밀어냄 */
  positionRailCards() {
    if (!this.railEl || !this.railItems || this.railEl.offsetParent === null) return; // narrow: rail 숨김
    let lastBottom = 0;
    this.railItems.forEach(({ card, row }) => {
      let top = row.offsetTop;
      if (lastBottom && top < lastBottom + 10) top = lastBottom + 10;
      card.style.top = top + "px";
      lastBottom = top + card.offsetHeight;
    });
    // 마지막 카드가 스레드보다 길게 내려가면 스크롤 영역 확보
    this.wrapEl.style.minHeight = lastBottom ? (lastBottom + 60) + "px" : "";
  }

  buildMsgRow(node, idx) {
    const row = document.createElement("div");
    const isUser = node.role === "user";
    row.className = `msg-row ${isUser ? "user" : "asst"}`;
    row.dataset.msgId = node.uuid;
    row.dataset.idx = idx;
    const bodyHtml = isUser ? esc(node.content || "") : renderRich(node.content || "");
    row.innerHTML = `
      <div class="bubble">
        <div class="body">${bodyHtml}</div>
        <div class="msg-meta">${isUser ? "사용자" : "Claude"} · #${idx}${node.ts ? " · " + esc(fmtTime(node.ts)) : ""}</div>
      </div>`;
    return row;
  }

  /* thinking 아코디언 — 항상 접힌 상태로 시작 */
  buildThinkBlock(nodes) {
    const totalChars = nodes.reduce((s, n) => s + String(n.content || "").length, 0);
    const wrap = document.createElement("div");
    wrap.className = "think";
    wrap.dataset.thinkId = nodes[0].uuid;
    const bodyHtml = nodes.map(n => esc(n.content || "")).join('<span class="think-sep"></span>');
    wrap.innerHTML = `
      <button class="think-toggle" aria-expanded="false">🧠 사고 과정 · ${totalChars.toLocaleString("ko-KR")}자 <span class="chev">▸</span></button>
      <div class="think-body">${bodyHtml}</div>`;
    const btn = wrap.querySelector(".think-toggle");
    btn.addEventListener("click", () => {
      const open = wrap.classList.toggle("open");
      btn.setAttribute("aria-expanded", String(open));
      requestAnimationFrame(() => this.reflow());
    });
    return wrap;
  }

  /* tool step 아코디언 — thinking과 같은 시각 언어, 항상 접힌 상태로 시작.
     kind:"tool" (요약 content 있음) + 구형 content 없는 링크를 하나의 그룹으로 묶는다. */
  buildToolBlock(nodes) {
    const n = nodes.length;
    const wrap = document.createElement("div");
    wrap.className = "steps";
    wrap.dataset.stepId = nodes[0].uuid;
    const items = nodes.map(nd => {
      const has = nd.hasContent && nd.kind === "tool";
      return `<div class="step${has ? "" : " empty"}"><span class="g">${has ? "⚙" : "·"}</span><span class="step-txt">${has ? esc(nd.content) : "(내용 없음)"}</span></div>`;
    }).join("");
    wrap.innerHTML = `
      <button class="steps-toggle" aria-expanded="false">🔧 ${n} tool step${n > 1 ? "s" : ""} <span class="chev">▸</span></button>
      <div class="steps-body">${items}</div>`;
    const btn = wrap.querySelector(".steps-toggle");
    btn.addEventListener("click", () => {
      const open = wrap.classList.toggle("open");
      btn.setAttribute("aria-expanded", String(open));
      requestAnimationFrame(() => this.reflow());
    });
    return wrap;
  }

  /* fork 앵커 메시지: 여백 카드(항상 표시) + 모서리 dot 마커, narrow에서는 칩 + 인라인 확장 fallback */
  attachForkAffordance(row, forks) {
    const entries = [];
    forks.forEach(({ fork, isStart }) => {
      const sel = this.selectedChild(fork);
      const alts = fork.children.filter(c => c !== sel);
      alts.forEach((alt, k) => entries.push({
        fork, isStart, alt, ord: k, sibN: alts.length,
        st: subtreeStats(alt), color: this.branchColor(alt.uuid),
      }));
    });
    if (!entries.length) return;
    const n = entries.length;
    const color = entries[0].color;
    const isStart = forks.some(f => f.isStart);
    const idx = +row.dataset.idx || 0;
    const label = isStart ? "시작점 분기" : `다른 분기 ${n}개`;

    row.classList.add("has-fork");
    row._forkColor = color;

    // (wide) 앵커 버블 모서리의 연상용 색 dot — 클릭 없이 카드와 짝을 맞춘다
    const dot = document.createElement("span");
    dot.className = "fork-dot";
    dot.style.background = color;
    dot.title = label;
    row.querySelector(".bubble").appendChild(dot);

    // (wide) 오른쪽 여백에 항상 보이는 분기 카드 — 앵커 row 높이에 정렬 (positionRailCards)
    if (this.railEl) {
      entries.forEach(({ fork, isStart: entStart, alt, ord, sibN, st, color: c }) => {
        const first = st.firstContent;
        const quote = first ? esc((first.content || "").slice(0, 200)) : "<i>(tool step만 포함)</i>";
        const card = document.createElement("div");
        card.className = "rc-card";
        card.style.borderLeftColor = c;
        card.innerHTML = `
          <span class="rc-conn" style="background:${c}"></span>
          <div class="rc-head">
            <span class="rc-name" style="color:${c}">⑂ ${this.forkName(fork)}${sibN > 1 ? "-" + (ord + 1) : ""} · abandoned</span>
            <span class="rc-time">${entStart ? "시작점 분기" : `#${idx}에서 분기`}${first && first.ts ? " · " + esc(fmtTime(first.ts)) : ""}</span>
          </div>
          <div class="rc-quote">${first ? `<span class="q-role">${first.role === "user" ? "사용자" : "Claude"}</span>` : ""}${quote}</div>
          <div class="rc-stats">
            <span>msgs <b>${st.textCount}</b></span>
            <span>깊이 <b>${st.maxDepth}</b></span>
            ${st.durMs != null ? `<span>소요 <b>${fmtDurMs(st.durMs)}</b></span>` : ""}
            ${st.forksInside ? `<span>분기 <b>${st.forksInside}</b></span>` : ""}
          </div>
          <button class="switch-btn" style="background:${c}">이 분기로 전환 →</button>`;
        card.querySelector(".switch-btn").addEventListener("click", () => this.switchToBranch(fork, alt));
        this.railEl.appendChild(card);
        this.railItems.push({ card, row, forkUuid: fork.uuid });
      });
    }

    // (narrow fallback) 모서리 칩 + 인라인 확장
    const chip = document.createElement("button");
    chip.className = "fork-chip";
    chip.setAttribute("aria-expanded", "false");
    chip.title = label;
    chip.style.borderColor = color + "88";
    chip.style.color = color;
    chip.innerHTML = `⑂ <b>${n}</b><span class="fc-label">${esc(label)}</span>`;
    row.querySelector(".bubble").appendChild(chip);

    const inline = document.createElement("div");
    inline.className = "fork-inline" + (row.classList.contains("user") ? " from-user" : "");
    entries.forEach(({ fork, isStart: entStart, alt, ord, sibN, st, color }) => {
      const first = st.firstContent;
      const quote = first ? esc((first.content || "").slice(0, 240)) : "<i>(내용 있는 메시지 없음 — tool step만 포함)</i>";
      const nested = st.forksInside ? ` · 분기 ${st.forksInside}개 포함` : "";
      const toolN = st.nodeCount - st.textCount - st.thinkCount;
      const el = document.createElement("div");
      el.className = "pv-alt";
      el.style.borderLeftColor = color;
      el.innerHTML = `
        <div class="pv-head">
          <span class="pv-name" style="color:${color}">${this.forkName(fork)}${sibN > 1 ? "-" + (ord + 1) : ""} — abandoned branch</span>
          <span class="pv-time">${first && first.ts ? esc(fmtTime(first.ts)) + " 분기" : ""}${st.durMs != null ? ` · ${fmtDurMs(st.durMs)} 진행 후 중단` : ""}</span>
        </div>
        <div class="pv-quote">${first ? `<span class="q-role">${first.role === "user" ? "사용자" : "Claude"}</span>` : ""}${quote}</div>
        <div class="pv-stats">
          <span class="pv-stat">메시지 <b>${st.textCount}</b>개</span>
          ${toolN ? `<span class="pv-stat">tool step <b>${toolN}</b></span>` : ""}
          <span class="pv-stat">깊이 <b>${st.maxDepth}</b></span>
          ${st.durMs != null ? `<span class="pv-stat">소요 <b>${fmtDurMs(st.durMs)}</b></span>` : ""}
          <span class="pv-stat">${entStart ? "세션 시작점에서 분기" : `#${idx} 메시지에서 분기`}${nested}</span>
        </div>
        <button class="switch-btn" style="background:${color}">이 분기로 전환 →</button>
        <span class="pv-hint">현재 main은 분기 기록으로 보관됩니다</span>`;
      el.querySelector(".switch-btn").addEventListener("click", () => this.switchToBranch(fork, alt));
      inline.appendChild(el);
    });
    row.insertAdjacentElement("afterend", inline);

    const setOpen = open => {
      if (open && this._openInline && this._openInline !== inline) {
        this._openInline.classList.remove("open");
        if (this._openInline._chip) this._openInline._chip.setAttribute("aria-expanded", "false");
        this._openInline = null;
      }
      inline.classList.toggle("open", open);
      chip.setAttribute("aria-expanded", String(open));
      if (open) this._openInline = inline;
      else if (this._openInline === inline) this._openInline = null;
      requestAnimationFrame(() => this.reflow());
    };
    inline._chip = chip;
    row._openFork = () => setOpen(true);
    chip.addEventListener("click", () => setOpen(!inline.classList.contains("open")));
  }

  switchToBranch(fork, altRoot) {
    this.selections[fork.uuid] = altRoot.uuid;
    this.render();
    this.thread.classList.remove("fading"); void this.thread.offsetWidth; this.thread.classList.add("fading");
    requestAnimationFrame(() => {
      const el = this.forkAnchors.get(fork.uuid);
      if (el) {
        this.scroller.scrollTo({ top: Math.max(0, el.offsetTop - this.scroller.clientHeight * 0.25), behavior: "smooth" });
        const chip = el.querySelector(".fork-chip"); // narrow fallback
        if (chip) { chip.classList.add("flash"); setTimeout(() => chip.classList.remove("flash"), 1500); }
      }
      // 여백 카드 플래시 (wide)
      (this.railItems || []).filter(it => it.forkUuid === fork.uuid).forEach(({ card }) => {
        card.classList.add("flash"); setTimeout(() => card.classList.remove("flash"), 1500);
      });
    });
    const c = this.branchColor(altRoot.uuid);
    showToast(`<span class="tdot" style="background:${c}"></span>${this.forkName(fork)}의 분기로 전환했습니다 — 이전 main은 분기 기록에 보관됩니다.`);
  }

  updateBadge(path) {
    const contentN = path.filter(isTextMsg).length;
    const el = document.getElementById("svBadge");
    if (el) el.innerHTML = `<span class="dot"></span><span>main branch: <b>${contentN} msgs</b>${this.hasForks ? ` · 분기 <b>${this.branchTotal}</b>개` : " · 분기 없음"}</span>`;
  }

  /* ----- minimap (simplified) ----- */
  renderMinimap() {
    const layerH = this.mmLayer.clientHeight;
    const total = this.scroller.scrollHeight;
    if (!total || !layerH) return;
    const scale = layerH / total;
    this.mmLayer.innerHTML = "";

    this.thread.querySelectorAll(".msg-row, .steps").forEach(row => {
      const bar = document.createElement("div");
      const isTool = row.classList.contains("steps");
      const isUser = row.classList.contains("user");
      bar.className = "mm-bar " + (isTool ? "t" : isUser ? "u" : "a");
      const top = row.offsetTop * scale;
      const h = Math.max(isTool ? 1 : 1.5, (row.offsetHeight - 14) * scale);
      bar.style.cssText = `top:${top}px; height:${h}px;`;
      this.mmLayer.appendChild(bar);
    });

    const seen = new Set();
    (this.forkAnchors || new Map()).forEach(row => {
      if (seen.has(row)) return;
      seen.add(row);
      const tick = document.createElement("div");
      tick.className = "mm-fork";
      tick.style.cssText = `top:${(row.offsetTop + 4) * scale}px; background:${row._forkColor || "var(--main)"};`;
      this.mmLayer.appendChild(tick);
    });

    this.updateViewport(scale);
  }
  updateViewport(scale) {
    scale = scale || (this.mmLayer.clientHeight / this.scroller.scrollHeight);
    let vp = this.mmLayer.querySelector(".mm-viewport");
    if (!vp) { vp = document.createElement("div"); vp.className = "mm-viewport"; this.mmLayer.appendChild(vp); }
    vp.style.top = (this.scroller.scrollTop * scale) + "px";
    vp.style.height = Math.max(18, this.scroller.clientHeight * scale) + "px";
  }
}

    const prevOf = {}; // id → parent id
    chains.forEach(chain => {
      let prev = null;
      chain.forEach(([id, role, hm, content, toolsBefore, kind]) => {
        for (let k = 0; k < (toolsBefore || 0); k++) {
          const tid = `${id}-t${k}`;
          prevOf[tid] = prev; prev = tid;
          // 대부분 kind:"tool" 요약 content, 일부는 구형 서버 호환용 content 없는 step
          const legacy = id === "m1" && k === 0;
          events.push({
            id: tid, role: "assistant", hm, sec: 10 + k * 5,
            content: legacy ? null : `Tool: ${["Bash", "Read", "Edit", "Grep"][k % 4]}\n→ ${id} 단계 ${k + 1} 실행 · 요약 로그`,
            kind: legacy ? undefined : "tool",
          });
        }
        prevOf[id] = prev; prev = id;
        events.push({ id, role, hm, sec: 30, content, kind });
      });
    });
    Object.entries(forkAttach).forEach(([childId, parentId]) => { prevOf[childId] = parentId; });
    events.sort((a, b) => (a.hm + pad(a.sec)).localeCompare(b.hm + pad(b.sec)));
    const links = [], messages = {};
    events.forEach((e, i) => {
      links.push({ uuid: e.id, parent_uuid: prevOf[e.id] || null, line_no: i + 1, role: e.role, has_content: e.content != null });
      if (e.content != null) {
        messages[e.id] = { role: e.role, ts: iso(e.hm, e.sec), content: e.content };
        if (e.kind) messages[e.id].kind = e.kind; // kind 생략 = "text"
      }
    });
    return { links, messages };
  }

  function search(q, project) {
    const ql = (q || "").toLowerCase();
    const hits = [];
    for (const [sid, d] of Object.entries(details)) {
      const meta = d.meta;
      if (project && !(meta.project_name || "").toLowerCase().includes(project.toLowerCase())) continue;
      for (const [uuid, msg] of Object.entries(d.messages)) {
        const idx = msg.content.toLowerCase().indexOf(ql);
        if (idx < 0) continue;
